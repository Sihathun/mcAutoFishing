name: Build and release

# Push a version tag (e.g. v1.0.0) to build AutoFishing.exe and publish it as a GitHub Release.
# Run it manually from the Actions tab to just build the exe as a downloadable artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload the exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path autofish.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($env:TAG -ne "v$version") {
            throw "Tag $env:TAG does not match __version__ = $version in autofish.py. Update it and re-tag."
          }

      - name: Build release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Fail fast (before the build) if the changelog has no entry for this version.
          $version = $env:TAG.TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^## \[" + [regex]::Escape($version) + "\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success -or [string]::IsNullOrWhiteSpace($m.Groups[1].Value)) {
            throw "CHANGELOG.md has no entry for [$version]. Add a '## [$version] - YYYY-MM-DD' section and re-tag."
          }
          $intro = "Download **AutoFishing.exe** below and double-click it. No Python needed. Windows may show a SmartScreen warning because the app is not code-signed: click *More info* then *Run anyway*."
          if ($version -match "-") {
            $intro = "> **Pre-release:** this is a testing build. It may have bugs, and the latest stable release is still the recommended download. Feedback is welcome.`n`n" + $intro
          }
          Set-Content release-notes.md ($intro + "`n`n" + $m.Groups[1].Value.Trim() + "`n") -Encoding utf8
          Get-Content release-notes.md

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build AutoFishing.exe
        run: pyinstaller --noconfirm --clean AutoFishing.spec

      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          # Exercises screen capture, template matching, Tk image rendering and keyboard hooks
          # inside the real exe. Exit code 0 = everything the app needs was bundled correctly.
          $p = Start-Process -FilePath dist\AutoFishing.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:APPDATA "AutoFishing\crash.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Self-test failed with exit code $($p.ExitCode)"
          }

      - name: Smoke-test that the window opens
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AutoFishing.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "AutoFishing.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\AutoFishing.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AutoFishing.exe" | Out-File -Encoding ascii dist\AutoFishing.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AutoFishing
          path: |
            dist/AutoFishing.exe
            dist/AutoFishing.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a hyphen (v1.1.0-beta.1) is a pre-release: it never becomes the "Latest" release.
          $flags = @()
          if ($env:TAG -match "-") { $flags += "--prerelease" }
          gh release create $env:TAG dist\AutoFishing.exe dist\AutoFishing.exe.sha256 `
            --title "AutoFishing $env:TAG" `
            --notes-file release-notes.md @flags
